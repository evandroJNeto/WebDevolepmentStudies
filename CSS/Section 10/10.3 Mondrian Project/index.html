<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .main-frame {
      width: 748px;
      height: 748px;
      background-color: #000;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
    }

    .item {
      background-color: #F0F1EC;
    }

    .red {
      background-color: #E72F24;
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    .white-top-right {
      grid-column: 2 / -1;
      grid-row: 1 / 2;
    }

    .white-mid-left {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
    }

    .white-center {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
    }

    .blue {
      background-color: #004592;
      grid-column: 4 / 5;
      grid-row: 2 / 3;
    }

    .white-bottom-right {
      grid-column: 4 / 5;
      grid-row: 3 / 5;
    }

    .white-bottom-left {
      grid-column: 1 / 2;
      grid-row: 4 / 5;
    }

    .yellow {
      background-color: #F9D01E;
      grid-column: 2 / 3;
      grid-row: 4 / 5;
    }

    .black {
      background-color: #232629;
      grid-column: 3 / 4;
      grid-row: 4 / 5;
    }
  </style>
</head>

<body>
  <div class="main-frame">
    <div class="item red"></div>
    <div class="item white-top-right"></div>
    <div class="item white-mid-left"></div>
    <div class="item white-center"></div>
    <div class="item blue"></div>
    <div class="item white-bottom-right"></div>
    <div class="item white-bottom-left"></div>
    <div class="item yellow"></div>
    <div class="item black"></div>
  </div>
</body>
</html>
