<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .blue-box{ /*repare que o z-index poderia ser desnecessario caso red-circle e blue-box fossem inscritos inversamente*/
      background-color : blue;
      width : 500px;
      height: 300px;
      position : relative;
      top : 200px;
      left : 200px;
    }
    .blue-box .red-circle{
      background-color: red;
      position : absolute;
      position : 0px;
      top : 150px;
      left : 250px;
      width : 200px;
      height : 200px;
      border-radius: 50%;
      z-index : 1;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
