<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    /*"red" #cf0f26
    "blue"#042767
    */
    .flag{
      background-color : #cf0f26;
      position : relative;
      width : 900px;
      height : 600px;
      z-index : 0;
    }
    .flag > p{
        color : white;
        position : absolute;
        font-size : 5rem;
        left : 300px;
        z-index : 1;
        top : -80px;
    }
    .flag div {
        width : 100%;
        height : 240px;
        background-color: #042767;
        z-index : 2;

        position: absolute;
        top : 0px;
        left : 0px;
        right : 0px;
        bottom : 0px;
        margin : auto;
    }

    .flag div div{
      background-color: white;
      height : 200px;
      width : 200px;
      border-radius : 50%;
      text-align : center;
      position : absolute;
    }

    .flag div div p{
      color : black;
      position : absolute;

      top : -80px;
      font-size : 5rem;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
